# Merge this provider into ~/.omp/agent/models.yml.
# Dani-Free owns backend discovery; OMP talks to one local OpenAI-compatible endpoint.
# Do not declare optional capabilities here; they are valid only when `/v1/models` advertises them.
providers:
  dani-free:
    baseUrl: http://127.0.0.1:4190/v1
    api: openai-completions
    auth: none
    models:
      - id: auto
        name: Dani-Free Auto
        input: [text]
        contextWindow: 128000
        maxTokens: 16384
